<!DOCTYPE html="{{ base.page.locale }}">
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ base.page.title }}</title>
        <meta name="description" content="{{ base.page.description }}">
        <link rel="canonical" href="{{ base.page.canonical_url }}">
        <link rel="icon" href="/media/icons/{{ base.page.favicon }}">
        <link rel="stylesheet" href="/dist/{{ base.assets.css }}">
        {% include "partials/open-graph.html" %}
        {% block head %}{% endblock %}
    </head>

    <body>
        {% include "partials/navbar.html" %}
        <main class="container">
            {% block content %}{% endblock %}
        </main>
        {% include "partials/footer.html" %}
        <script type="module" src="/dist/{{ base.assets.js }}"></script>
        {% for schema in base.page.json_ld %}
            <script type="application/ld+json">
                {{ schema | safe }}
            </script>
        {% endfor %}
    </body>
</html>
